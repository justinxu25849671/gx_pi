<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视觉定位画面</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #e3e8ee;
      --text: #1c2430;
      --muted: #5c6b7a;
      --accent: #0b6bcb;
      --ok: #0d7a45;
      --warn: #9a6200;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      padding: 16px 20px 8px;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 650; }
    p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      padding: 12px 20px 20px;
    }
    .stage, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .stage { padding: 10px; min-height: 360px; }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #f7f8fa;
      border-radius: 8px;
      cursor: crosshair;
    }
    .panel { padding: 14px 16px 18px; }
    h2 { margin: 14px 0 8px; font-size: 15px; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .error {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #fff1f2;
      color: #9f1239;
      font-size: 13px;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      padding: 8px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
      line-height: 1.45;
    }
    .xy { color: var(--accent); font-variant-numeric: tabular-nums; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .empty { color: var(--muted); padding-top: 8px; font-size: 13px; }
    .colors { display: flex; flex-wrap: wrap; gap: 8px; }
    .colors button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font: inherit;
    }
    .colors button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>处理后的相机画面</h1>
      <p>画面中心为 (0, 0)，x 向右为正，y 向下为正。选择颜色后分割该颜色圆形，并把画面最上层的稳定圆心发给下位机。</p>
    </div>
  </header>
  <main>
    <section class="stage">
      <img id="view" alt="处理后的相机画面" src="/stream.mjpg">
    </section>
    <aside class="panel">
      <div class="meta" id="meta">等待画面…</div>
      <h2>识别颜色</h2>
      <div class="colors" id="colors">
        <button type="button" data-color="">全部</button>
        <button type="button" data-color="red">红</button>
        <button type="button" data-color="yellow">黄</button>
        <button type="button" data-color="blue">蓝</button>
        <button type="button" data-color="green">绿</button>
      </div>
      <h2>学习物料</h2>
      <div class="meta" id="learn">先点选红、黄、蓝或绿，再在画面上点一下该物料。学到的颜色会立刻用于识别，并写入配置。</div>
      <div class="error" id="error"></div>
      <h2>发送目标</h2>
      <div class="meta" id="target">未选择颜色，不发送</div>
      <h2>圆环圆心</h2>
      <ul id="rings"></ul>
      <h2>物料圆心</h2>
      <ul id="objects"></ul>
    </aside>
  </main>
  <script>
    const meta = document.getElementById("meta");
    const errorBox = document.getElementById("error");
    const rings = document.getElementById("rings");
    const targetBox = document.getElementById("target");
    const sendText = {
      idle: "未选择颜色，不发送",
      waiting: "该颜色还没有稳定的上层圆形",
      sending: "正在发送",
      aligned: "圆心已到画面中心，定位结束",
      error: "发送失败",
    };
    const objects = document.getElementById("objects");
    const learnBox = document.getElementById("learn");
    const view = document.getElementById("view");
    let frameSize = { width: 0, height: 0 };
    let selectedColor = "";
    const colorButtons = document.querySelectorAll("#colors button");

    function markColor(color) {
      colorButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.color === (color || ""));
      });
    }

    async function setColor(color) {
      const response = await fetch("/color", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ color }),
      });
      if (!response.ok) throw new Error("颜色无效");
      markColor(color);
      selectedColor = color;
    }

    function list(node, items, emptyText, render) {
      node.replaceChildren();
      if (!items || items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = emptyText;
        node.appendChild(empty);
        return;
      }
      for (const item of items) node.appendChild(render(item));
    }

    function row(text, xy, state) {
      const li = document.createElement("li");
      const name = document.createElement("div");
      name.textContent = text;
      const coord = document.createElement("div");
      coord.className = "xy";
      coord.textContent = xy;
      const flag = document.createElement("div");
      flag.className = state.ok ? "ok" : "warn";
      flag.textContent = state.text;
      li.append(name, coord, flag);
      return li;
    }

    async function refresh() {
      try {
        const response = await fetch("/status.json", { cache: "no-store" });
        const status = await response.json();
        const tune = status.tune || {};
        const auto = tune.detect_width
          ? ` · 自动 检测${tune.detect_width} 预览${tune.preview_width} JPEG ${tune.jpeg_quality}`
          : "";
        const motionText = status.motion === "hold" ? " · 静止少算" : "";
        meta.textContent = `相机 ${status.camera_index} · ${status.width}×${status.height} · ${Number(status.fps).toFixed(1)} FPS · ${status.mode}${auto}${motionText}`;
        frameSize = { width: Number(status.width) || 0, height: Number(status.height) || 0 };
        selectedColor = status.locate_color || "";
        markColor(selectedColor);
        const target = status.target;
        const state = sendText[status.send_state] || "未发送";
        targetBox.textContent = target
          ? `#${target.track_id ?? "?"} ${target.color} 上层圆形 xy = (${target.x}, ${target.y}) · ${state}`
          : state;
        if (status.error) {
          errorBox.style.display = "block";
          errorBox.textContent = status.error;
        } else {
          errorBox.style.display = "none";
          errorBox.textContent = "";
        }
        list(rings, status.rings, "当前没有圆环", (item) => row(
          `#${item.track_id ?? "?"} 环 ${item.position == null ? "未绑定" : item.position} · 半径 ${item.radius_px.toFixed(1)} px`,
          `xy = (${item.x}, ${item.y})`,
          { ok: item.valid && item.stable, text: item.reason || (item.stable ? "稳定" : "未稳定") }
        ));
        list(objects, status.objects, "当前没有物料", (item) => row(
          `#${item.track_id ?? "?"} ${item.color}`,
          `xy = (${item.x}, ${item.y})`,
          { ok: item.stable, text: item.stable ? `稳定 ${item.stable_frames} 帧` : `未稳定 ${item.stable_frames} 帧` }
        ));
      } catch (error) {
        errorBox.style.display = "block";
        errorBox.textContent = "状态读取失败";
      }
    }

    document.getElementById("colors").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      setColor(button.dataset.color || "").catch(() => {
        errorBox.style.display = "block";
        errorBox.textContent = "识别颜色切换失败";
      });
    });

    view.addEventListener("click", (event) => {
      if (!selectedColor) {
        learnBox.textContent = "请先选择要学习的颜色";
        return;
      }
      if (!frameSize.width || !frameSize.height) {
        learnBox.textContent = "画面尚未就绪";
        return;
      }
      const rect = view.getBoundingClientRect();
      const x = Math.round((event.clientX - rect.left) / rect.width * frameSize.width);
      const y = Math.round((event.clientY - rect.top) / rect.height * frameSize.height);
      fetch("/learn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ color: selectedColor, x, y }),
      }).then(async (response) => {
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "学习失败");
        learnBox.textContent = `已学习${selectedColor}，识别范围已更新`;
      }).catch((error) => {
        learnBox.textContent = error.message || "学习失败";
      });
    });

    refresh();
    setInterval(refresh, 300);
  </script>
</body>
</html>
